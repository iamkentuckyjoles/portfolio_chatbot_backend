version: "3.9"

services:
  web:
    build: .
    container_name: chatbot_web
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8001:8000"   # host:container
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: chatbot_db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
